<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunnah Diet — Recipes from the Prophet ﷺ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ────────────────────────────────────── -->
  <header>
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
      <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')">FR</button>
    </div>
    <div class="header-ornament">✦ ✦ ✦</div>
    <h1>Sunnah Diet</h1>
    <p class="header-arabic">سُنَّة النَّبِيِّ ﷺ في الطَّعَام</p>
    <p id="header-subtitle"></p>
    <p class="salawat">اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّد</p>
  </header>

  <!-- ── Main ──────────────────────────────────────── -->
  <main>

    <!-- Search -->
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search-input" type="text" />
    </div>

    <!-- Category Filters -->
    <div id="filters"></div>

    <!-- Recipe Grid -->
    <div id="recipe-grid"></div>

  </main>

  <!-- ── Recipe Modal ───────────────────────────────── -->
  <div id="recipe-modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <div class="modal-inner">

      <!-- Modal Header -->
      <div class="modal-header">
        <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
        <span id="modal-emoji"></span>
        <span id="modal-category"></span>
        <h2 id="modal-name"></h2>
        <p id="modal-arabic"></p>
        <p id="modal-desc"></p>
        <div class="modal-meta">
          <span id="modal-prep-label">⏱ <strong id="modal-prep"></strong></span>
          <span id="modal-cook-label">🔥 <strong id="modal-cook"></strong></span>
          <span id="modal-servings-label">🍽 <strong id="modal-servings"></strong></span>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">

        <!-- Hadith Reference -->
        <div class="hadith-block">
          <div class="hadith-label" id="section-hadith-label"></div>
          <p id="modal-hadith-text"></p>
          <p id="modal-hadith-meta"></p>
        </div>

        <!-- Ingredients -->
        <h3 class="section-title" id="section-ingredients"></h3>
        <ul id="modal-ingredients"></ul>

        <!-- Instructions -->
        <h3 class="section-title" id="section-instructions"></h3>
        <ol id="modal-instructions"></ol>

        <!-- Notes -->
        <div class="notes-block">
          <div class="notes-label" id="section-notes-label"></div>
          <p id="modal-notes"></p>
        </div>

      </div>
    </div>
  </div>

  <!-- ── Footer ─────────────────────────────────────── -->
  <footer>
    <p><strong>Sunnah Diet</strong> — <span id="footer-tagline"></span></p>
    <p id="footer-sources"></p>
    <p style="margin-top:0.5rem; font-size:0.8rem; opacity:0.6;" id="footer-dua"></p>
  </footer>

  <script src="recipes.js"></script>
</body>
</html>
